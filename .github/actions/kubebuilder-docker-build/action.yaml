name: Kubebuilder Docker Build
description: Builds (and optionally pushes) a Kubebuilder container image

inputs:
  image-name:
    description: Container image name (without registry/tag)
    required: true
  registry:
    description: Container registry URL
    required: false
    default: ghcr.io
  version:
    description: Version tag for the image (optional, uses "latest" if not provided)
    required: false
    default: latest
  push:
    description: Whether to push the built image
    required: false
    default: "false"
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: Dockerfile
  context:
    description: Build context path
    required: false
    default: .
  github-token:
    description: GitHub token for registry authentication
    required: true

outputs:
  image-digest:
    description: SHA digest of the built image
    value: ${{ steps.build.outputs.digest }}
  image-id:
    description: Image ID of the built image
    value: ${{ steps.build.outputs.imageid }}
  tags:
    description: Tags of the built image
    value: ${{ steps.build.outputs.tags }}
  metadata:
    description: Build metadata
    value: ${{ steps.build.outputs.metadata }}

runs:
  using: composite
  steps:

    - name: Setup Go
      uses: konfidence-project/.github/.github/actions/setup-go@main

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64

    - name: Log in to Container Registry
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Generate manifests and code
      shell: bash
      run: |
        make manifests generate

    - name: Build manager binary
      shell: bash
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/manager cmd/main.go

    - name: Build and push container image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: ${{ inputs.push }}
        tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.version }}
