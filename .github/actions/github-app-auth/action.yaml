name: GitHub App Authentication
description: Authenticates GitHub CLI and Git using a short-lived GitHub App installation token

inputs:
  client-id:
    required: true
    description: Id of GitHub App used for token generation
  private-key:
    required: true
    description: Private key for konfidence-project GitHub App
  repositories:
    required: false
    description: Comma-separated repositories the token may access; defaults to the current repository

runs:
  using: composite
  steps:
    - name: Generate GitHub App Token
      id: generate-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repositories || github.event.repository.name }}

    - name: Persist GitHub App Token for Job
      shell: bash
      run: |
        echo "GH_TOKEN=${{ steps.generate-token.outputs.token }}" >> $GITHUB_ENV

    - name: Configure GitHub CLI and Git
      shell: bash
      run: |
        # Configure GitHub CLI authentication
        echo "Setting up GitHub CLI authentication..."
        gh auth status
        gh auth setup-git
