name: GitHub App Authentication
description: Create a repository-scoped, downscoped installation token without persisting credentials
inputs:
  client-id:
    required: true
    description: GitHub App client ID
  private-key:
    required: true
    description: GitHub App private key
  repositories:
    description: Explicit comma-separated repository names; defaults to this repository
    required: false
  permission-contents:
    description: Contents permission
    default: read
  permission-pull-requests:
    description: Optional pull request permission
    required: false
outputs:
  token:
    description: Short-lived token; pass only to the step that needs it
    value: ${{ steps.token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Generate scoped GitHub App token
      id: token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repositories || github.event.repository.name }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
