name: GitHub Repo Access
description: Sets up GitHub CLI authentication for private repositories inside this org (konfidence-project)

inputs:
  client-id:
    required: true
    description: Id of GitHub App used for token generation
  private-key:
    required: true
    description: Private key for konfidence-project GitHub App

runs:
  using: composite
  steps:
    - name: Generate GitHub App Token
      id: generate-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}

    - name: Persist GitHub App Token for Job
      shell: bash
      run: |
        echo "GH_TOKEN=${{ steps.generate-token.outputs.token }}" >> $GITHUB_ENV

    - name: Setup GitHub CLI authentication
      shell: bash
      run: |
        # Configure GitHub CLI authentication
        echo "Setting up GitHub CLI authentication..."
        gh auth status
        gh auth setup-git
