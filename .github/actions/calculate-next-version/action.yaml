name: "Calculate next version"
description: "Calculates the next version based on the latest tags and conventional commit messages"

outputs:
  version:
    description: "The next version that should be created"
    value: ${{ steps.calculate-next-version.outputs.version }}

runs:
  using: "composite"
  steps:    
    - name: Install svu
      shell: bash
      run: go install github.com/caarlos0/svu/v3@latest
    
    - name: Calculate next version
      shell: bash
      id: calculate-next-version
      run: |
        # Get current version (latest tag)
        CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "::debug::Current version: $CURRENT_VERSION"
        
        # Get next version using svu
        NEXT_VERSION=$(svu next || echo "")
        echo "::debug::Next version would be: $NEXT_VERSION"
        
        # Check if next version is different from current version
        if [ "$NEXT_VERSION" != "" ] && [ "$NEXT_VERSION" != "$CURRENT_VERSION" ]; then
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "should-release=true" >> $GITHUB_OUTPUT
          echo "::debug::Next version: $NEXT_VERSION"
        else
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "should-release=false" >> $GITHUB_OUTPUT
          echo "::debug::No next version found"
        fi