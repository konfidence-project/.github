name: GoReleaser
description: Sets up Docker publishing prerequisites and runs GoReleaser in the current job.

inputs:
  mode:
    required: true
    description: 'Build mode: "pr" (compile only), "main" (build + push images tagged with SHA), "release" (full release via goreleaser)'
  registry:
    required: false
    description: Container registry to log in to
    default: ghcr.io
  snapshot-tag:
    required: false
    description: Tag to use for snapshot builds (e.g. git SHA). Leave empty for release mode.
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve mode
      id: cfg
      shell: bash
      run: |
        case "${{ inputs.mode }}" in
          pr)
            echo "args=build --clean --single-target --snapshot" >> "$GITHUB_OUTPUT"
            echo "login-registry=false"                          >> "$GITHUB_OUTPUT"
            echo "push-images=false"                             >> "$GITHUB_OUTPUT"
            ;;
          main)
            echo "args=release --clean --snapshot"               >> "$GITHUB_OUTPUT"
            echo "login-registry=true"                           >> "$GITHUB_OUTPUT"
            echo "push-images=true"                              >> "$GITHUB_OUTPUT"
            ;;
          release)
            echo "args=release --clean"                          >> "$GITHUB_OUTPUT"
            echo "login-registry=true"                           >> "$GITHUB_OUTPUT"
            echo "push-images=false"                             >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Invalid mode '${{ inputs.mode }}'. Must be one of: pr, main, release."
            exit 1
            ;;
        esac

    - name: Log in to Container Registry
      if: steps.cfg.outputs.login-registry == 'true'
      uses: docker/login-action@v4.5.2
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: '~> v2'
        args: ${{ steps.cfg.outputs.args }}
      env:
        GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ inputs.snapshot-tag }}

    - name: Push Docker images
      if: steps.cfg.outputs.push-images == 'true'
      shell: bash
      run: |
        # Collect all per-arch image references from goreleaser's artifact manifest
        # e.g. ghcr.io/konfidence-project/star-operator:<sha>-amd64
        IMAGES=$(jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json)

        # Push all per-arch images
        echo "${IMAGES}" | xargs -I{} docker push {}

        # Create and push a multi-arch manifest for each unique base image
        echo "${IMAGES}" | sed 's/-amd64$//;s/-arm64$//' | sort -u | while read -r BASE; do
          ARCH_IMAGES=$(echo "${IMAGES}" | grep "^${BASE}-")
          # shellcheck disable=SC2086
          docker manifest create "${BASE}" ${ARCH_IMAGES}
          docker manifest push "${BASE}"
        done
