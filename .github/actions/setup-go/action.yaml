name: 'Setup Go with Private Repository Access'
description: 'Sets up Go and configures GitHub CLI authentication for private repositories inside this org (konfidence-project)'
inputs:
  go-version-file:
    description: 'Path to go.mod file for Go version'
    required: false
    default: 'go.mod'

runs:
  using: 'composite' 
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      env:
        GOPRIVATE: github.com/konfidence-project
      with:
        go-version-file: ${{ inputs.go-version-file }}
    
 