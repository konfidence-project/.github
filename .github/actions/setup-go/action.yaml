# TODO: UNUSED since version >= v2 and DEPRECATED

name: Setup Go with Private Repository Access
description: Sets up Go and configures GitHub CLI authentication for private repositories inside this org (konfidence-project)
inputs:
  go-version-file:
    description: Path to go.mod file for Go version
    required: false
    default: go.mod

runs:
  using: composite 
  steps:
    - name: Set GOPRIVATE
      shell: bash
      run: |
        echo "GOPRIVATE=github.com/konfidence-project" >> $GITHUB_ENV
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
    