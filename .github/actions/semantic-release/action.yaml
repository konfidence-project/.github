name: 'Semantic Release'
description: 'Complete semantic release setup and execution with automatic config detection'
author: 'konfidence-project'

inputs:
  dry-run:
    description: 'Whether to run semantic release in dry-run mode'
    required: false
    default: 'false'
outputs:
  new-release-published:
    description: 'Whether a new release was published'
    value: ${{ steps.release.outputs.new_release_published }}
  new-release-version:
    description: 'Version of the new release'
    value: ${{ steps.release.outputs.new_release_version }}

runs:
  using: 'composite'
  steps:
    - name: Setup semantic release configuration
      id: setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # List of common semantic release config files
        config_files=(
          ".releaserc.json"
          ".releaserc.yml" 
          ".releaserc.yaml"
          ".releaserc"
          "release.config.js"
          "release.config.mjs"
          "release.config.cjs"
          "release.config.ts"
        )
        
        config_found=false
        config_file=""
        
        # Check if any config file exists
        for file in "${config_files[@]}"; do
          if [ -f "$file" ]; then
            echo "Semantic release config found: $file"
            cat "$file"
            config_found=true
            config_file="$file"
            break
          fi
        done
        
        # If no config file found, create the default config inline
        if [ "$config_found" = false ]; then
          echo "No semantic release config found. Creating default config for Go Modules (i.e. only create git tags, no publishing to npm)..."
          
          # Create the default semantic release configuration
          cat > .releaserc.json << 'EOF'
          {
              "branches": [
                "main"
              ],
              "plugins": [
                "@semantic-release/commit-analyzer",
                "@semantic-release/release-notes-generator",
                "@semantic-release/git",
                "@semantic-release/github"
              ]
            }
          EOF
          
          echo "Created default .releaserc.json with the following contents:"
          cat .releaserc.json
          config_file=".releaserc.json"
        fi
        
        # Set outputs
        echo "config-found=$config_found" >> $GITHUB_OUTPUT
        echo "config-file=$config_file" >> $GITHUB_OUTPUT

    - name: Execute semantic release
      id: release
      uses: cycjimmy/semantic-release-action@v4
      with:
        dry_run: ${{ inputs.dry-run }}
        extra_plugins: |
            @semantic-release/commit-analyzer 
            @semantic-release/release-notes-generator 
            @semantic-release/github 
            @semantic-release/git
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
