name: "Semantic Release"
description: "Runs semantic-release to determine next version and optionally create release"

inputs:
  dry-run:
    description: "Run in dry-run mode (only determine next version, don't create release)"
    required: false
    default: 'false'
  github-token:
    description: "GitHub token for creating releases"
    required: true

outputs:
  version:
    description: "The next version that would be created"
    value: ${{ steps.semantic-release.outputs.version }}
  new-release-published:
    description: "Whether a new release was published"
    value: ${{ steps.semantic-release.outputs.new-release-published }}
  release-notes:
    description: "The release notes generated"
    value: ${{ steps.semantic-release.outputs.release-notes }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install semantic-release
      shell: bash
      run: |
        npm install -g semantic-release \
          @semantic-release/commit-analyzer \
          @semantic-release/release-notes-generator \
          @semantic-release/github \
          @semantic-release/git
          @semantic-release/exec


    - name: Run semantic-release
      shell: bash
      id: semantic-release
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          echo "Running semantic-release in dry-run mode..."
          
          # Run semantic-release in dry-run mode to get next version
          npx semantic-release --dry-run
          
          echo "debug: $(nextRelease)"
          # Extract the next version from output
          NEXT_VERSION=$(nextRelease.version)
          
          if [[ -n "$NEXT_VERSION" ]]; then
            echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
            echo "new-release-published=true" >> $GITHUB_OUTPUT
            echo "Next version would be: $NEXT_VERSION"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "new-release-published=false" >> $GITHUB_OUTPUT
            echo "No new version would be created"
          fi
        else
          echo "Running semantic-release..."
          
          # Run semantic-release normally
          npx semantic-release 
          
          echo "debug: $(nextRelease)"
          # Extract the next version from output
          NEXT_VERSION=$(nextRelease.version)
          
          if [[ -n "$NEXT_VERSION" ]]; then
            echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
            echo "new-release-published=true" >> $GITHUB_OUTPUT
            echo "Next version would be: $NEXT_VERSION"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "new-release-published=false" >> $GITHUB_OUTPUT
            echo "No next version found"
          fi
        fi
