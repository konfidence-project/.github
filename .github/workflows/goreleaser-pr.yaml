name: Build without publishing
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Activate repository Hermit environment
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false
      # Direct upstream actions avoid depending on a commit from this PR to
      # bootstrap the release that consumers will pin.
      - name: Build snapshot without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --single-target --snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.sha }}
