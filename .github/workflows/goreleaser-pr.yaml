name: Build without publishing
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: konfidence-project/.github/.github/actions/goreleaser@7ce51f5807984870589cf6221e7d331244a684ca # hardened actions, no shared binary cache
        with:
          mode: pr
          snapshot-tag: ${{ github.sha }}
