name: Kubebuilder CI Pipeline

on:
  workflow_call:
    inputs:
      image-name:
        description: Container image name (without registry/tag)
        type: string
        default: ${{ github.repository }}
      registry:
        description: Container registry URL
        required: false
        type: string
        default: 'ghcr.io'
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: Build context path
        required: false
        type: string
        default: '.'
      bake-file:
        description: Path to docker-bake.hcl file
        required: false
        type: string
        default: 'docker-bake.hcl'
      targets:
        description: Bake targets to build (comma-separated, empty = all)
        required: false
        type: string
        default: ''
      
      # Test configuration
      before-tests:
        description: Command to run before tests
        required: false
        type: string
        default: ''
      
      # Release manifest configuration
      release_manifests:
        description: Whether to generate k8s deployment manifests as release assets
        required: false
        type: boolean
        default: true

jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@v3
    secrets: inherit

  test:
    name: Test
    uses: konfidence-project/.github/.github/workflows/kubebuilder-test.yaml@v3
    secrets: inherit
    with:
      before-tests: ${{ inputs.before-tests }}

  build:
    name: Build Container Image
    needs: [lint, test]
    uses: konfidence-project/.github/.github/workflows/kubebuilder-build-and-release.yaml@v3
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write
    with:
      image-name: ${{ inputs.image-name }}
      registry: ${{ inputs.registry }}
      push: false  # CI builds don't push
      release: false  # CI builds don't release
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      bake-file: ${{ inputs.bake-file }}
      targets: ${{ inputs.targets }}
      release_manifests: ${{ inputs.release_manifests }}

  ci-gate:
    name: Status check Job for CI
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    steps:
      - run: echo "All required checks passed"