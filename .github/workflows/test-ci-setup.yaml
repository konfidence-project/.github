name: Test CI Setup

on:
  push

jobs:
  test-ci-setup:
    name: Validate CI Configuration
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/konfidence-project
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 1702387
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup Go with private repos
        uses: ./.github/actions/setup-go
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Verify GOPRIVATE environment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          echo "GOPRIVATE is set to: $GOPRIVATE"
          if [[ "$GOPRIVATE" == *"github.com/konfidence-project"* ]]; then
            echo "[PASS] GOPRIVATE correctly configured"
          else
            echo "[FAIL] GOPRIVATE not properly set"
            exit 1
          fi

      - name: Test Go module operations
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          echo "Testing Go module operations..."
          go version
          go env GOPRIVATE
          
          # Test that we can download modules (this will use private repo access if needed)
          echo "Running go mod download..."
          go mod download
          
          echo "Running go mod verify..."
          go mod verify
          
          echo "[PASS] Go module operations successful"

      - name: Test private repository access
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          echo "Checking if we can access private dependencies..."
          
          # Check if there are any private dependencies in go.mod
          if grep -q "github.com/konfidence-project" go.mod; then
            echo "Found private dependencies, testing access..."
            go list -m all | grep "github.com/konfidence-project" || echo "No private dependencies currently resolved"
          else
            echo "No private dependencies found in go.mod"
          fi
          
          echo "[PASS] Private repository access test completed"

      - name: Validate shared action functionality
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          echo "Validating that our shared action works correctly..."
          
          # Check that Go is properly installed
          if command -v go &> /dev/null; then
            echo "[PASS] Go is installed: $(go version)"
          else
            echo "[FAIL] Go is not installed"
            exit 1
          fi
          
          # Check that GitHub CLI authentication is working
          if gh auth status > /dev/null 2>&1; then
            echo "[PASS] GitHub CLI authentication is configured"
          else
            echo "[FAIL] GitHub CLI authentication is not working"
            exit 1
          fi
          
          echo "[PASS] Shared action validation completed successfully"
