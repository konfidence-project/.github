name: Build & Publish

on:
  workflow_call:
    inputs:
      registry:
        description: Container registry to log in to
        required: false
        type: string
        default: ghcr.io
      mode:
        description: 'Publishing mode: "main" (SHA-tagged images) or "release" (full release). PR builds must call goreleaser-pr.yaml.'
        required: true
        type: string
      snapshot-tag:
        description: Tag for main builds or the release-please tag. Leave empty for tag-triggered releases.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    name: Validate publish request
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject unsupported modes and untrusted events
        env:
          MODE: ${{ inputs.mode }}
          MERGED_RELEASE_PR: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.action == 'closed' &&
                github.event.pull_request.merged == true &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        run: |
          case "$MODE" in
            main|release) ;;
            pr) echo '::error::PR builds must use goreleaser-pr.yaml; this workflow only publishes.'; exit 1 ;;
            *) echo '::error::Publishing mode must be main or release.'; exit 1 ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" != push ]] &&
             ! [[ "$GITHUB_EVENT_NAME" == pull_request &&
                  "${MERGED_RELEASE_PR:-false}" == true &&
                  "$MODE" == release && "$GITHUB_REF" == refs/heads/main ]]; then
            echo '::error::Publishing requires a trusted push or a merged Release PR on main.'
            exit 1
          fi
          case "$MODE:$GITHUB_REF" in
            main:refs/heads/main|release:refs/heads/main|release:refs/tags/*) ;;
            *) echo '::error::This ref is not eligible for the requested publishing mode.'; exit 1 ;;
          esac

  goreleaser:
    name: Build & Publish
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'main' && 'automation' || 'release' }}
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Activate repository Hermit environment
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"

      - name: Resolve publishing arguments
        id: cfg
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            main) echo 'args=release --clean --snapshot' >> "$GITHUB_OUTPUT" ;;
            release) echo 'args=release --clean' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.cfg.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.snapshot-tag }}

      - name: Push Docker images
        if: inputs.mode == 'main'
        run: |
          IMAGES=$(jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json)
          echo "${IMAGES}" | xargs -I{} docker push {}
          echo "${IMAGES}" | sed 's/-amd64$//;s/-arm64$//' | sort -u | while read -r BASE; do
            ARCH_IMAGES=$(echo "${IMAGES}" | grep "^${BASE}-")
            # shellcheck disable=SC2086
            docker manifest create "${BASE}" ${ARCH_IMAGES}
            docker manifest push "${BASE}"
          done
