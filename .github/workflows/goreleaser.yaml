name: Build & Publish

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the GoReleaser job
        required: false
        type: string
        default: ubuntu-latest
      registry:
        description: Container registry to log in to
        required: false
        type: string
        default: ghcr.io
      mode:
        description: 'Build mode: "pr" (compile only), "main" (build + push images tagged with SHA), "release" (full release via goreleaser)'
        required: true
        type: string
      snapshot-tag:
        description: Tag to use for snapshot builds (e.g. git SHA). Leave empty for release mode.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  goreleaser:
    name: Build & Publish
    # Untrusted PR builds use goreleaser-pr.yaml, which requests no write token.
    if: >-
      github.event_name == 'push' &&
      ((inputs.mode == 'main' && github.ref == 'refs/heads/main') ||
       (inputs.mode == 'release' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))))
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Init Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Build & Publish
        uses: konfidence-project/.github/.github/actions/goreleaser@7ce51f5807984870589cf6221e7d331244a684ca # hardened actions, no shared binary cache
        with:
          mode: ${{ inputs.mode }}
          registry: ${{ inputs.registry }}
          snapshot-tag: ${{ inputs.snapshot-tag }}
