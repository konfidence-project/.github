on: 
  push: 
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@main
        with:
          private-key: ${{secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
            
      - name: release new version
        id: semantic-release
        uses: konfidence-project/.github/.github/actions/semantic-release@main
            
      - name: update major version tag
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: |
          # Extract major version from the new release version
          NEW_VERSION="${{ steps.semantic-release.outputs.new-release-version }}"
          MAJOR_VERSION=$(echo "$NEW_VERSION" | cut -d. -f1)
            
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
            
          # Force update the major version tag
          git tag -f "v$MAJOR_VERSION"
          git push origin "v$MAJOR_VERSION" --force
            
          echo "Updated major version tag v$MAJOR_VERSION to point to version $NEW_VERSION"
            