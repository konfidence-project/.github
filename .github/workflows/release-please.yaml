name: Release PR
on:
  workflow_call:
    outputs:
      release_created:
        description: '"true" when the merged release PR produced a tag and draft release'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the created release (e.g. 1.2.3)
        value: ${{ jobs.release-please.outputs.tag_name }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      # pinned to a SHA, not the moving @v4: this workflow produces v4, so it
      # must not depend on it — a broken v4 would take down the pipeline
      # needed to fix v4
      - uses: konfidence-project/.github/.github/actions/github-app-auth@6e6fceb7157f77584cc55e967e0a765ef8c65736 # v4.5.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ env.GH_TOKEN }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
