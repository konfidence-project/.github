name: Create Release
on:
  workflow_call:
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY:
        required: true
    outputs:
      release_created:
        description: '"true" when the merged release PR produced a tag and draft release'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the created release (e.g. 1.2.3)
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: read

jobs:
  release-please:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.ref == 'refs/heads/main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    environment: release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - id: auth
        uses: konfidence-project/.github/.github/actions/github-app-auth@177af7fa40657b660c259ebe9afefa0c2fdb0d57
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.auth.outputs.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true
