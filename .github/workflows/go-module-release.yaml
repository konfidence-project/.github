name: Go Module Build and Release

on: 
  workflow_call:
    outputs:
      version:
        description: 'Version that was created'
        value: ${{ jobs.release.outputs.version }}
      new-release-published:
        description: 'Whether a new release was published'
        value: ${{ jobs.release.outputs.new-release-published }}
    secrets:
      konfidence-project-repo-access-private-key:
        description: 'Private key for konfidence-project GitHub App'
        required: true

jobs: 
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.semantic-release.outputs.new-release-version }}
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@main
        with:
          private-key: ${{ secrets.konfidence-project-repo-access-private-key }}

      - name: Setup Go
        uses: konfidence-project/.github/.github/actions/setup-go@main

      - name: Semantic Release
        id: semantic-release
        uses: konfidence-project/.github/.github/actions/semantic-release-setup@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
