name: Go Module Build and Release

on: 
  workflow_call:
    outputs:
      version:
        description: 'Version that was created'
        value: ${{ jobs.release.outputs.version }}
      new-release-published:
        description: 'Whether a new release was published'
        value: ${{ jobs.release.outputs.new-release-published }}
    secrets:
      konfidence-project-repo-access-private-key:
        description: 'Private key for konfidence-project GitHub App'
        required: true

jobs: 
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@main
        with:
          private-key: ${{ secrets.konfidence-project-repo-access-private-key }}

      - name: Setup Go
        uses: konfidence-project/.github/.github/actions/setup-go@main

          
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry-run: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra_plugins: |
            @semantic-release/commit-analyzer 
            @semantic-release/release-notes-generator 
            @semantic-release/github 
            @semantic-release/git
          
        
