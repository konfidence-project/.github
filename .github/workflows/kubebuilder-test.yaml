name: Kubebuilder Tests

on: 
  workflow_call:
    secrets:
      konfidence-project-repo-access-private-key:
        description: 'Private key for konfidence-project GitHub App'
        required: true

jobs:

  check-for-secret:
    name: Check for Secret
    runs-on: ubuntu-latest
    steps:
      - name: Check for Secret
        run: |
          echo "konfidence-project-repo-access-private-key: ${{ secrets.konfidence-project-repo-access-private-key }}"
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/konfidence-project
    steps:
    - name: Clone the code
      uses: actions/checkout@v4

    - name: Setup GitHub Repo Access
      uses: konfidence-project/.github/.github/actions/github-repo-access@main
      with:
        private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

    - name: Setup Go
      uses: konfidence-project/.github/.github/actions/setup-go@main

    - name: Running Tests
      run: |
        go mod tidy
        make test 