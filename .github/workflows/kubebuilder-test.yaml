name: Kubebuilder Tests
on: 
  workflow_call:
    inputs:
        test-cmd:
          description: Command to run to test the kubebuilder project
          required: false
          type: string
          default: test
        before-tests:
            description: Command to run before tests (e.g., setup commands like make commands)
            required: false
            type: string
        after-tests:
            description: Command to run after tests (e.g., cleanup commands)
            required: false
            type: string

jobs:
  kubebuilder-test:
    name: Run on Ubuntu
    runs-on: konfidence-large
    steps:
      - name: Clone the code
        uses: actions/checkout@v5

      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@v2
        with:
          private-key: ${{secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
         
      - name: Setup Go
        uses: konfidence-project/.github/.github/actions/setup-go@v2

      - name: Before Tests Setup
        if: ${{ inputs.before-tests }}
        run: ${{ inputs.before-tests }}

      - name: Run Tests
        run: |
          go mod tidy
          make ${{ inputs.test-cmd }}

      - name: After Tests Cleanup
        if: ${{ inputs.after-tests }}
        run: ${{ inputs.after-tests }}