name: Controller CI Pipeline

on:
  workflow_call:
    inputs:
      image-name:
        description: Container image name (without registry/tag)
        type: string
        default: ${{ github.repository }}
      registry:
        description: Container registry URL
        required: false
        type: string
        default: 'ghcr.io'
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: Build context path
        required: false
        type: string
        default: '.'
      bake-file:
        description: Path to docker-bake.hcl file
        required: false
        type: string
        default: 'docker-bake.hcl'
      targets:
        description: Bake targets to build (comma-separated, empty = all)
        required: false
        type: string
        default: ''
      skip-build:
        description: skip build job
        required: false
        type: boolean
        default: false

      # Test configuration
      before-tests:
        description: Command to run before tests
        required: false
        type: string
        default: ''

      # Controller test configuration
      run-controller-tests:
        description: Whether to run controller tests (requires Docker on runner)
        required: false
        type: boolean
        default: false

      # Release manifest configuration
      release_manifests:
        description: Whether to generate k8s deployment manifests as release assets
        required: false
        type: boolean
        default: true

jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@v4
    secrets: inherit

  test:
    name: Test
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      before-tests: ${{ inputs.before-tests }}

  controller-test:
    name: Controller Test
    if: ${{ inputs.run-controller-tests }}
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test-controller

  build:
    name: Build Container Image
    needs: [lint, test]
    uses: konfidence-project/.github/.github/workflows/controller-build-and-release.yaml@v4
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write
    with:
      image-name: ${{ inputs.image-name }}
      registry: ${{ inputs.registry }}
      push: false
      release: false
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      bake-file: ${{ inputs.bake-file }}
      targets: ${{ inputs.targets }}
      release_manifests: ${{ inputs.release_manifests }}
      skip-build: ${{ inputs.skip-build }}

  ci-gate:
    name: Status check Job for CI
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - controller-test
      - build
    if: always()
    steps:
      - name: Fail if any job failed or cancelled
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          CI_FAILED=$(echo "$NEEDS_JSON" | jq -r '
          to_entries[]
          | select(.value.result == "failure" or .value.result == "cancelled")
          | .key
          ')

          if [ -n "$CI_FAILED" ]; then
          echo "Failed jobs:"
          echo "$CI_FAILED"
          exit 1
          fi

          echo "All required jobs passed or were skipped"
