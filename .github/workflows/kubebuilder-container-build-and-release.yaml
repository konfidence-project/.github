name: Kubebuilder Container Build and Release

on: 
  workflow_call:
    inputs:
      image-name:
        description: Container image name (without registry/tag)
        type: string
        default: ${{ github.repository }}
      registry:
        description: Container registry URL
        required: false
        type: string
        default: 'ghcr.io'
      push:
        description: Whether to push the built image
        required: false
        type: boolean
        default: true

      release:
        description: Whether to create a release
        required: false
        type: boolean
        default: true
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: Build context path
        required: false
        type: string
        default: '.'
    outputs:
      image-digest:
        description: SHA digest of the built image
        value: ${{ jobs.build.outputs.digest }}
      version:
        description: Version that was created
        value: ${{ jobs.version.outputs.version }}

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE_NAME: ${{ inputs.image-name }}

jobs: 
  version:
    name: Determine next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic-release-dry-run.outputs.new-release-version }}
      new-release-published: ${{ steps.semantic-release-dry-run.outputs.new-release-published }}
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@fix/ci-code-review-issues
        with:
          private-key: ${{secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          
      - name: Semantic Release (dry-run)
        id: semantic-release-dry-run
        uses: konfidence-project/.github/.github/actions/semantic-release@fix/ci-code-review-issues
        with:
          dry-run: true
  build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: version
   
    outputs:
      digest: ${{ steps.docker-build.outputs.image-digest }}
      tags: ${{ steps.docker-build.outputs.tags }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: konfidence-project/.github/.github/actions/setup-go@fix/ci-code-review-issues
    
      - name: Build and Push Docker Image
        id: docker-build
        uses: konfidence-project/.github/.github/actions/kubebuilder-docker-build@fix/ci-code-review-issues
        with:
          image-name: ${{ inputs.image-name }}
          registry: ${{ inputs.registry }}
          version: ${{ needs.version.outputs.version }}
          push: ${{ inputs.push && needs.version.outputs.new-release-published }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: ${{ needs.build.outputs.digest && needs.version.outputs.new-release-published && inputs.release }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@fix/ci-code-review-issues
        with:
          private-key: ${{secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          
      - name: Semantic Release (create release)
        id: semantic-release
        uses: konfidence-project/.github/.github/actions/semantic-release@fix/ci-code-review-issues