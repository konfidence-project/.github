name: Pre-release
on:
  workflow_call:
    inputs:
      version:
        description: Pre-release version (e.g. 1.0.0-rc.1)
        required: true
        type: string
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY:
        required: true
permissions:
  contents: read
jobs:
  tag:
    name: Create Pre-release Tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Validate pre-release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Expected X.Y.Z-<suffix>'; exit 1;
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: auth
        uses: konfidence-project/.github/.github/actions/github-app-auth@4d42404fca8862353c7fa2d457142d82b10a0930 # hardened actions
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          permission-contents: write
      - name: Create and push the reviewed main commit tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          gh auth setup-git
          git tag -- "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
