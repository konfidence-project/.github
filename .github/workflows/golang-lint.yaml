name: Golang CI Lint

on:
  workflow_call:
    inputs:
      codegen-cmd:
        description: 'Make targets to run for formatting and codegen drift check (e.g. "fmt vet manifests generate")'
        required: false
        type: string
        default: 'fmt vet manifests generate'

jobs:
  lint:
    name: Lint Golang
    runs-on: konfidence-large
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Cache linting step
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/.golangci.yml', '**/.golangci.yaml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-
      
      - name: Run Linter
        run: |
          make lint

      - name: Check formatting and codegen
        run: |
          make ${{ inputs.codegen-cmd }}
          git diff --exit-code || { echo "Uncommitted changes detected after ${{ inputs.codegen-cmd }}. Run 'make ${{ inputs.codegen-cmd }}' locally and commit the results."; exit 1; }
