name: Golang CI Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint Golang
    runs-on: konfidence-large
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@v3
        with:
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          
      - name: Set GOPRIVATE
        run: echo "GOPRIVATE=github.com/konfidence-project" >> $GITHUB_ENV
      
      - name: Cache linting step
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/.golangci.yml', '**/.golangci.yaml') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-
      
      - name: Run Linter
        run: |
          make lint