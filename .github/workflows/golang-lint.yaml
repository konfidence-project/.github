name: Golang CI Lint

on:
  workflow_call:
    inputs:
      codegen-cmd:
        description: 'Make targets to run for formatting and codegen drift check (e.g. "fmt vet manifests generate")'
        required: false
        type: string
        default: 'fmt vet manifests generate'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Golang
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Activate repository Hermit environment
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"

      - name: Cache linting step
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/.golangci.yml', '**/.golangci.yaml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-
      
      - name: Run Linter
        run: |
          make lint

      - name: Check formatting and codegen
        env:
          CODEGEN_TARGETS: ${{ inputs.codegen-cmd }}
        run: |
          if [[ -n "$CODEGEN_TARGETS" ]]; then
            [[ "$CODEGEN_TARGETS" =~ ^[a-zA-Z0-9][a-zA-Z0-9_[:space:]-]*$ ]] || exit 1
            read -r -a targets <<< "$CODEGEN_TARGETS"
            make -- "${targets[@]}"
          fi
          git diff --exit-code || { echo "Generated files changed; run the configured Make targets locally."; exit 1; }
