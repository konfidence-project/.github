name: Kubebuilder Container Build

on: 
  workflow_call:
    inputs:
      image-name:
        description: 'Container image name (without registry/tag)'
        type: string
        default: ${{ github.repository }}
      registry:
        description: 'Container registry URL'
        required: false
        type: string
        default: 'ghcr.io'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
    secrets:
      konfidence-project-repo-access-private-key:
        description: 'Private key for konfidence-project GitHub App'
        required: true

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE_NAME: ${{ inputs.image-name }}

jobs: 
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker Image
        uses: konfidence-project/.github/.github/actions/kubebuilder-docker-build@main
        with:
          image-name: ${{ inputs.image-name }}
          registry: ${{ inputs.registry }}
          version: 'latest'
          push: false
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        
