name: Kubebuilder Container Build

on: 
  workflow_call:
    inputs:
      image-name:
        description: 'Container image name (without registry/tag)'
        required: true
        type: string
      registry:
        description: 'Container registry URL'
        required: false
        type: string
        default: 'ghcr.io'
      platforms:
        description: 'Target platforms for multi-arch build'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: 'Whether to push the built image'
        required: false
        type: boolean
        default: true
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
    outputs:
      image-digest:
        description: 'SHA digest of the built image'
        value: ${{ jobs.build.outputs.digest }}
      image-tags:
        description: 'Full image tags that were built'
        value: ${{ jobs.build.outputs.tags }}
    secrets:
      konfidence-project-repo-access-private-key:
        description: 'Private key for konfidence-project GitHub App'
        required: true

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.build.outputs.tags }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      GOPRIVATE: github.com/konfidence-project
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@main
        with:
          private-key: ${{ secrets.konfidence-project-repo-access-private-key }}

      - name: Setup Go
        uses: konfidence-project/.github/.github/actions/setup-go@main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate manifests and code
        run: |
          make manifests generate

      - name: Build manager binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/manager cmd/main.go

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image-name }}-dev-${{ github.sha }}
       

