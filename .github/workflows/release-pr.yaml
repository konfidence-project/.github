name: Update Release PR

on:
  workflow_call:
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  release-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: automation
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: konfidence-project/.github/.github/actions/github-app-auth@5e9b632f4421802e0e424b6340de6f13e50cba70
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # Built-in PR-only mode: no tags or releases, and no approval gate.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.auth.outputs.token }}
          target-branch: main
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          skip-github-release: true
