name: Publish Helm Charts

on:
  workflow_call:
    inputs:
      mode:
        description: 'Publishing mode: "release" validates chart versions; "dev" packages charts with the caller commit as appVersion.'
        required: false
        type: string
        default: release
      version:
        description: Required in release mode; the release version to validate against and publish (e.g. 1.2.3).
        required: false
        type: string
      charts:
        description: Space-separated list of chart directories to validate, package, and publish (e.g. "charts/star charts/galaxy").
        required: true
        type: string
      registry:
        description: OCI registry base URL to push charts to (e.g. ghcr.io/konfidence-project).
        required: false
        type: string
        default: ghcr.io/konfidence-project

jobs:
  publish-helm-charts:
    name: Publish Helm Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MODE: ${{ inputs.mode }}
      CHARTS: ${{ inputs.charts }}
      VERSION: ${{ inputs.version }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Validate publishing mode
        run: |
          case "$MODE" in
            release)
              if [ -z "$VERSION" ]; then
                echo "version is required in release mode"
                exit 1
              fi
              ;;
            dev) ;;
            *) echo "Unsupported publishing mode: $MODE"; exit 1 ;;
          esac
          if [ -z "$CHARTS" ]; then
            echo "charts must not be empty"
            exit 1
          fi

      - name: Validate Helm chart versions
        if: inputs.mode == 'release'
        run: |
          read -r -a CHART_PATHS <<< "$CHARTS"
          for CHART in "${CHART_PATHS[@]}"; do
            CHART_VERSION=$(yq -r '.version' "${CHART}/Chart.yaml")
            APP_VERSION=$(yq -r '.appVersion' "${CHART}/Chart.yaml" | tr -d '"')

            if [ "${CHART_VERSION}" != "${VERSION}" ]; then
              echo "${CHART}/Chart.yaml version ${CHART_VERSION} does not match release ${VERSION}"
              exit 1
            fi

            if [ "${APP_VERSION}" != "${VERSION}" ]; then
              echo "${CHART}/Chart.yaml appVersion ${APP_VERSION} does not match release ${VERSION}"
              exit 1
            fi
          done

      - name: Package Helm charts
        run: |
          mkdir -p dist
          read -r -a CHART_PATHS <<< "$CHARTS"
          for CHART in "${CHART_PATHS[@]}"; do
            if [ "$MODE" = dev ]; then
              RELEASE_VERSION=$(yq -r '.version' "${CHART}/Chart.yaml")
              BASE_VERSION="${RELEASE_VERSION%%[-+]*}"
              # Caller run numbers order builds; retries cannot overtake a newer run.
              CHART_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
              helm lint "$CHART"
              helm package "$CHART" --destination dist \
                --version "$CHART_VERSION" --app-version "$GITHUB_SHA"
            else
              helm package "$CHART" --destination dist
            fi
          done

      - name: Log in to Helm Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish Helm charts
        run: |
          for CHART_PACKAGE in dist/*.tgz; do
            helm push "${CHART_PACKAGE}" "oci://${REGISTRY}/charts"
          done
