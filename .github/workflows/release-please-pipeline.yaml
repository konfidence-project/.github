name: Release PR

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yaml
    secrets: inherit

  # Runs only on the push that merges a release PR. Retags the moving major
  # version tag first, then removes the draft flag — consumers pinning @vN
  # never see a published release the major tag doesn't cover yet.
  #
  # Recovery after a failure here: use "re-run failed jobs", NOT "re-run all
  # jobs" — a full re-run makes release-please report nothing (the release PR
  # is already tagged), release_created stays empty, and this job silently
  # skips while the release stays draft.
  publish-release:
    name: Publish Release
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # checkout the release tag, not github.sha — if this run replaced one
      # that was cancelled while queued, github.sha is newer than the release
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}

      - name: Update major version tag
        run: |
          MAJOR="${TAG%%.*}"
          git tag -f "${MAJOR}"
          git push --force origin "${MAJOR}"

      - name: Undraft release
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
