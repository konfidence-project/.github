name: Release PR

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Ordinary pushes and unrelated PR closures must not replace a queued release.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.label || 'main' }}
  cancel-in-progress: false

jobs:
  update-release-pr:
    name: Update Release PR
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-pr.yaml
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

  release-please:
    name: Create Release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    uses: ./.github/workflows/release-please.yaml
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

  # Runs only after approved release creation following a Release PR merge.
  # Retags the moving major version first, then removes the draft flag —
  # consumers pinning @vN never see a release the major tag doesn't cover yet.
  #
  # Recovery after a failure here: use "re-run failed jobs", NOT "re-run all
  # jobs" — a full re-run makes release-please report nothing (the release PR
  # is already tagged), release_created stays empty, and this job silently
  # skips while the release stays draft.
  publish-release:
    name: Publish Release
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # checkout the release tag, not github.sha — if this run replaced one
      # that was cancelled while queued, github.sha is newer than the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Create repository-scoped publishing token
        id: auth
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Update major version tag
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          MAJOR="${TAG%%.*}"
          gh auth setup-git
          git tag -f "${MAJOR}"
          git push --force origin "${MAJOR}"

      - name: Undraft release
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
