name: Create new version

on:
  workflow_call:

jobs:
  create-version:
    name: Create new version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Go
      uses: konfidence-project/.github/.github/actions/setup-go@main
    
    - name: Install svu
      run: go install github.com/caarlos0/svu/v3@latest
    
    - name: Generate next version
      id: version
      run: |
        NEXT_VERSION=$(svu next)
        echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
        echo "Next version will be: $NEXT_VERSION"
    
    - name: Create and push tag
      if: steps.version.outputs.next_version != ''
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag ${{ steps.version.outputs.next_version }}
        git push origin ${{ steps.version.outputs.next_version }}
    
    outputs:
      new_version: ${{ steps.version.outputs.next_version }}
    