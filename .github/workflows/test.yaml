name: Controller Tests
on:
  workflow_call:
    inputs:
      test-cmd:
        description: Space-separated Make targets (not shell code)
        type: string
        default: test
      before-tests:
        description: Supported setup command; only pnpm install --frozen-lockfile is accepted
        type: string
        default: ''
      after-tests:
        description: Deprecated; arbitrary shell hooks are not accepted
        type: string
        default: ''
permissions:
  contents: read
env:
  ENVTEST_K8S_VERSION: '1.33'
jobs:
  controller-test:
    name: ${{ inputs.test-cmd }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Prepare tests
        env:
          BEFORE_TESTS: ${{ inputs.before-tests }}
          AFTER_TESTS: ${{ inputs.after-tests }}
        run: |
          [[ -z "$AFTER_TESTS" ]] || { echo 'Arbitrary after-tests hooks are not supported'; exit 1; }
          case "$BEFORE_TESTS" in
            '') ;;
            'pnpm install --frozen-lockfile') pnpm install --frozen-lockfile ;;
            *) echo 'Unsupported before-tests command'; exit 1 ;;
          esac
      - name: Run Tests
        env:
          TEST_TARGETS: ${{ inputs.test-cmd }}
        run: |
          [[ "$TEST_TARGETS" =~ ^[a-zA-Z0-9][a-zA-Z0-9_[:space:]-]*$ ]] || exit 1
          read -r -a targets <<< "$TEST_TARGETS"
          make -- "${targets[@]}"
