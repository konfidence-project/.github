name: Renovate Bot
# This workflow is mostly based on following self-hosted renovate workflow example:
# https://github.com/renovatebot/github-action?tab=readme-ov-file#persisting-the-repository-cache

on:
  workflow_dispatch: 
    inputs:
        repoCache:
          description: 'Reset or disable the cache?'
          type: choice
          default: enabled
          options:
            - enabled
            - disabled
            - reset
  schedule:
    - cron: "0 8-18 * * 1-5" ## Every hour on weekdays between 08:00 and 18:00 UTC but not on weekends

permissions:
  checks: read
  statuses: read
  actions: read
  packages: write
  contents: write
  issues: write
  pull-requests: write

# Cache settings (artifact-based repository cache)
env:
  cache_archive: renovate_cache.tar.gz
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (config)
        uses: actions/checkout@v5

      - name: Setup GitHub Repo Access
        id: github-repo-access
        uses: konfidence-project/.github/.github/actions/github-repo-access@main
        with:
          private-key: ${{ secrets.konfidence-project-repo-access-private-key }}

      # Restore previous repository cache (artifact-based)
      - name: Download previous cache artifact
        uses: dawidd6/action-download-artifact@v11
        if: github.event.inputs.repoCache != 'disabled'
        continue-on-error: true
        with:
          name: ${{ env.cache_key }}
          path: cache-download

      - name: Extract renovate cache
        if: github.event.inputs.repoCache != 'disabled'
        run: |
          # Enable strict error handling: exit on errors (-e), undefined vars (-u), 
          # print commands (-x), and fail on pipe errors (-o pipefail)
          set -euxo pipefail
          if [ -d cache-download ]; then
            mkdir -p "$cache_dir"
            tar -xzf "cache-download/${{ env.cache_archive }}" -C "$cache_dir" || true
            # Renovate container runs as UID 12021; ensure ownership matches to avoid EACCES
            sudo chown -R 12021:0 /tmp/renovate
          else
            echo "No previous cache found."
          fi

      # Run Renovate
      - name: Renovate Bot GitHub Action
        uses: renovatebot/github-action@v43.0.8
        with:
          configurationFile: renovate-config/config.json
          token: ${{ steps.github-repo-access.outputs.token }}
        env:
          LOG_LEVEL: info
          # Enable repository cache (self-hosted option; can be set via env)
          RENOVATE_REPOSITORY_CACHE: enabled

      # Save repository cache for the next run
      - name: Compress renovate cache
        if: always()
        run: |
          set -euxo pipefail
          if [ -d "$cache_dir" ]; then
            tar -czvf "${{ env.cache_archive }}" -C "$cache_dir" .
          fi

      - name: Upload cache artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.cache_key }}
          path: ${{ env.cache_archive }}
          retention-days: 1