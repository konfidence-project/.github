name: Dependabot Automerge
# Metadata only: never check out or execute pull request code.
# Queue auto-merge, but never supply the human/code-owner approval.
on:
  workflow_call:
  pull_request_target:
permissions: {}
jobs:
  automerge:
    # Immutable github.com account ID for dependabot[bot]. Check both the
    # event sender and PR author; a human push to a bot-owned PR is not enough.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.sender.id == 49699333 &&
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge after required reviews and checks
        if: >-
          steps.metadata.outputs.package-ecosystem != 'github_actions' &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --rebase --match-head-commit "$HEAD_SHA" "$PR_URL"
