name: Secret Scanning Review

# Fails a PR whose commits triggered GitHub Secret Scanning alerts and posts
# the findings as a PR comment. Complements push protection, which only blocks
# known provider patterns at push time — generic/non-provider patterns merely
# alert and would otherwise land unnoticed.
#
# Requires the konfidence-bot app to have "Secret scanning alerts: read" —
# the default github.token cannot access the secret-scanning API.
on:
  workflow_call:

jobs:
  secret-scanning-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: konfidence-project/.github/.github/actions/github-app-auth@v4
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - uses: advanced-security/secret-scanning-review-action@v2.2.8
        with:
          token: ${{ env.GH_TOKEN }}
          fail-on-alert: true
          # resolved/dismissed alerts stop blocking, so triaging a false
          # positive unblocks the PR without a re-push
          fail-on-alert-exclude-closed: true
