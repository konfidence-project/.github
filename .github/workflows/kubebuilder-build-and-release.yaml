name: Kubebuilder Container Build and Release

on:
  workflow_call:
    inputs:
      image-name:
        description: Container image name (without registry/tag)
        type: string
        default: ${{ github.repository }}
      registry:
        description: Container registry URL
        required: false
        type: string
        default: "ghcr.io"
      push:
        description: Whether to push the built image
        required: false
        type: boolean
        default: true

      release:
        description: Whether to create a release
        required: false
        type: boolean
        default: true
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: Build context path
        required: false
        type: string
        default: "."
      bake-file:
        description: Path to docker-bake.hcl file
        required: false
        type: string
        default: "docker-bake.hcl"
      targets:
        description: Bake targets to build (comma-separated, empty = all)
        required: false
        type: string
        default: ""

      release_manifests:
        description: Whether to generate k8s deployment manifests as release assets
        required: false
        type: boolean
        default: true
    outputs:
      metadata:
        description: Build metadata
        value: ${{ jobs.build.outputs.metadata }}
      version:
        description: Version that was created
        value: ${{ jobs.version.outputs.version }}

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  version:
    name: Determine next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine-version.outputs.version }}
      image-tag: ${{ steps.calculate-image-tag.outputs.image-tag }}
      new-release-published: ${{ steps.semantic-release-dry-run.outputs.new-release-published }}
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@v2
        with:
          private-key: ${{secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - name: Semantic Release (dry-run)
        id: semantic-release-dry-run
        uses: konfidence-project/.github/.github/actions/semantic-release@v2
        with:
          dry-run: true

      - name: Determine version
        id: determine-version
        shell: bash
        run: |
          if [ -n "${{ steps.semantic-release-dry-run.outputs.new-release-version }}" ]; then
            echo "version=${{ steps.semantic-release-dry-run.outputs.new-release-version }}" >> $GITHUB_OUTPUT
            echo "Using semantic-release version: ${{ steps.semantic-release-dry-run.outputs.new-release-version }}"
          else
            VERSION="${{github.sha}}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "Using fallback git sha version: ${VERSION}"
          fi

      - name: Calculate Image Tag
        id: calculate-image-tag
        shell: bash
        run: |
          VERSION="${{ steps.determine-version.outputs.version }}"
          IMAGE_TAG="${{ inputs.registry }}/${{ inputs.image-name }}:${VERSION}"
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Calculated image tag: ${IMAGE_TAG}"
  build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: version

    outputs:
      metadata: ${{ steps.docker-build.outputs.metadata }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@v2
        with:
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: ${{ inputs.push && needs.version.outputs.new-release-published }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push with Bake
        id: docker-build
        uses: docker/bake-action@v6
        with:
          source: ${{ inputs.context }}
          files: ${{ inputs.bake-file }}
          targets: ${{ inputs.targets }}
          push: ${{ inputs.push && needs.version.outputs.new-release-published }}
          set: |
            *.tags=${{ needs.version.outputs.image-tag }}
            *.secrets=id=gh_token,env=GH_TOKEN
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}

      - name: Setup Kustomize
        if: ${{ inputs.release && inputs.release_manifests }}
        uses: imranismail/setup-kustomize@v2

      - name: Generate release artifacts
        if: ${{ inputs.release && inputs.release_manifests }}
        env:
          IMAGE: ${{ needs.version.outputs.image-tag }}
        run: |
          mkdir -p config/release
          ( cd config/manager && kustomize edit set image ${{ github.repository }}=${IMAGE} ) 
          kustomize build config/manager > config/release/controller.deployment.yaml

      - name: Upload release artifacts
        if: ${{ inputs.release && inputs.release_manifests }}
        uses: actions/upload-artifact@v4
        with:
          name: controller.deployment.yaml
          path: config/release/
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: ${{ needs.build.outputs.metadata && needs.version.outputs.new-release-published && inputs.release }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@v2
        with:
          private-key: ${{secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - name: Download release artifacts
        if: ${{ inputs.release && inputs.release_manifests }}
        uses: actions/download-artifact@v5
        with:
          name: controller.deployment.yaml
          path: dist

      - name: Semantic Release (create release)
        id: semantic-release
        uses: konfidence-project/.github/.github/actions/semantic-release@v2
